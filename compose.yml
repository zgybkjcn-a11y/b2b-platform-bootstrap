name: b2b-platform
x-api-env: &api-env
  APP_VERSION: ${APP_VERSION}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
  NODE_ENV: production
  AUTH_REQUIRED: "true"
  DATA_BACKEND: postgres
  DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  WEB_URL: ${PUBLIC_ORIGIN}
  EXPORT_WEB_URL: http://web:31000
  TRUST_PROXY: "true"
  # 平台管理员配置「默认代理」时的部署白名单（逗号分隔 host）。代理跑在宿主机上时
  # 地址必然是内网（如 docker 网关 172.18.0.1），不加进白名单就存不进去。留空＝不允许内网代理。
  PLATFORM_PRIVATE_UPSTREAM_HOSTS: ${PLATFORM_PRIVATE_UPSTREAM_HOSTS:-}
  TENANT_SETTINGS_ENCRYPTION_KEYS: ${TENANT_SETTINGS_ENCRYPTION_KEYS}
  TENANT_SETTINGS_ACTIVE_KEY_ID: ${TENANT_SETTINGS_ACTIVE_KEY_ID:-v1}
  BACKUP_SERVICE_URL: http://backup:31004
  BACKUP_SERVICE_TOKEN: ${BACKUP_SERVICE_TOKEN}
  BACKUP_CONFIGURED: "true"
  AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  UPDATE_MANIFEST_URL: ${UPDATE_MANIFEST_URL:-https://raw.githubusercontent.com/zgybkjcn-a11y/b2b-platform-bootstrap/main/stable.json}
  UPDATE_RELEASE_URL_TEMPLATE: ${UPDATE_RELEASE_URL_TEMPLATE:-https://github.com/zgybkjcn-a11y/b2b-marketing-intelligence-platform/releases/tag/{version}}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 12 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 10s, timeout: 5s, retries: 12 }
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [minio-data:/data]
  migrate:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-api:${APP_VERSION}
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [node, apps/api/dist/migrate-postgres.mjs]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-api:${APP_VERSION}
    restart: unless-stopped
    environment: *api-env
    volumes: [api-data:/app/apps/api/data]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://localhost:31001/health], interval: 15s, timeout: 5s, retries: 12 }
  worker:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-api:${APP_VERSION}
    restart: unless-stopped
    command: [node, apps/api/dist/growthWorker.js]
    environment: *api-env
    volumes: [api-data:/app/apps/api/data]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  dispatcher:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-api:${APP_VERSION}
    restart: unless-stopped
    command: [node, apps/api/dist/growthScheduleDispatcher.js]
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  backup:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-api:${APP_VERSION}
    restart: unless-stopped
    command: [node, apps/api/dist/backupService.js]
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_SERVICE_TOKEN: ${BACKUP_SERVICE_TOKEN}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_DIR: /backups
    volumes: [backup-data:/backups]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    image: ghcr.io/zgybkjcn-a11y/b2b-platform-web:${APP_VERSION}
    restart: unless-stopped
    environment: { API_URL: http://api:31001, WEB_AUTH_REQUIRED: "true", DEPLOYMENT_MODE: "${DEPLOYMENT_MODE}" }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:31000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - target: 80
        published: "${PUBLIC_HTTP_PORT:-8080}"
        protocol: tcp
      - target: 443
        published: "${PUBLIC_HTTPS_PORT:-44443}"
        host_ip: "${PUBLIC_HTTPS_HOST:-127.0.0.1}"
        protocol: tcp
      - target: 443
        published: "${PUBLIC_HTTPS_PORT:-44443}"
        host_ip: "${PUBLIC_HTTPS_HOST:-127.0.0.1}"
        protocol: udp
    environment: { PUBLIC_HOST: "${PUBLIC_HOST}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", caddy-data:/data, caddy-config:/config]
    depends_on: { web: { condition: service_healthy } }
volumes: { postgres-data: {}, redis-data: {}, minio-data: {}, api-data: {}, backup-data: {}, caddy-data: {}, caddy-config: {} }
